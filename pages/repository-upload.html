href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>

<header class="dashboard-header">

<div class="dashboard-topbar">

<h2>IRS Admin</h2>

<div class="topbar-right">

<a href="admin-dashboard.html" class="submit-project-btn">

<i class="bi bi-arrow-left"></i>

Dashboard

</a>

</div>

</div>

</header>

<div class="dashboard-layout">

<!-- Sidebar -->

<aside class="sidebar">

<h3>Administrator</h3>

<ul>

<li><a href="admin-dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>

<li><a href="pending-projects.html"><i class="bi bi-clock-history"></i> Review Submissions</a></li>

<main class="dashboard-main">

<section class="welcome-section">

<h1>Repository Upload</h1>

<p>

Upload archived or departmental projects directly into the repository.

</p>

</section>

<div class="dashboard-card">

<form id="repositoryUploadForm">

<div class="form-grid">

<div class="form-group">

<label>Project Title</label>

<input
type="text"
id="projectTitle"
required>

</div>

<div class="form-group">

<label>Student Name</label>

<input
type="text"
id="studentName"
required>

</div>

<div class="form-group">

<label>Matric Number (Optional)</label>

<input
type="text"
id="matricNumber">

</div>

<div class="form-group">

<label>Faculty</label>

<select id="faculty" required>

<option value="">Select Faculty</option>

</select>

</div>

<div class="form-group">

<label>Department</label>

<select id="department" required>

<option value="">Select Department</option>

</select>

</div>

<div class="form-group">

<label>Supervisor</label>

<input
type="text"
id="supervisor"
required>

</div>

<div class="form-group">

<label>Academic Session</label>

<input
type="text"
id="session"
placeholder="e.g. 2024/2025"
required>

</div>

<div class="form-group">

<label>Keywords</label>

<input
type="text"
id="keywords"
placeholder="AI, Repository, Search"
required>

</div>

</div>

<div class="form-group">

<label>Abstract</label>

<textarea
id="abstract"
rows="8"
required></textarea>

</div>

<div class="form-group">

<label>Project PDF</label>

<input
type="file"
id="projectFile"
accept=".pdf"
required>

</div>

<button
type="submit"
class="submit-project-btn">

<i class="bi bi-cloud-upload"></i>

Publish Project

</button>

</form>

</div>

</main>

</div>

<script src="../assets/js/abu-data.js"></script>
<script src="../assets/js/repository-upload.js"></script>
<script src="../assets/js/activity-helper.js"></script>
<script src="../assets/js/auth.js"></script>
</body>

</html>
