{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Project</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<header class="dashboard-header">

<div class="dashboard-topbar">

<h2>Edit Repository Project</h2>

<a href="manage-repository.html" class="submit-project-btn">

Back

</a>

</div>

</header>

<div class="dashboard-main">

<div class="dashboard-card">

<form id="editProjectForm">

<div class="form-grid">

<div class="form-group">

<label>Project Title</label>

<input
type="text"
id="title"
required>

</div>

<div class="form-group">

<label>Student Name</label>

<input
type="text"
id="studentName"
required>

</div>

<div class="form-group">

<label>Supervisor</label>

<input
type="text"
id="supervisor">

</div>

<div class="form-group">

<label>Session</label>

<input
type="text"
id="session">

</div>

<div class="form-group">

<label>Keywords</label>

<input
type="text"
id="keywords">

</div>

</div>

<div class="form-group">

<label>Abstract</label>

<textarea
id="abstract"
rows="8"></textarea>

</div>

<button
class="submit-project-btn"
type="submit">

Save Changes

</button>

</form>

</div>

</div>

<script src="{% static 'js/activity-helper.js' %}"></script>
<script src="{% static 'js/edit-project.js' %}"></script>
<!-- <script src="../assets/js/activity-helper.js"></script>
<script src="../assets/js/edit-project.js"></script> -->

</body>

</html>
